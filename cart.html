<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bag</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="hd"></div>
<div class="wrap"><h1 style="font-size:22px;margin-bottom:8px">Your bag</h1><div id="ct"></div></div>
<div id="ft"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="config.js"></script>
<script src="app.js"></script>
<script>ready.then(()=>{
function draw(){const c=rd();
if(!c.length){$("#ct").innerHTML='<p>Your bag is empty.</p><p><a class="btn" href="collection.html?c=all">Start shopping</a></p>';return}
let t=0;
$("#ct").innerHTML=c.map((i,x)=>{const p=P.find(y=>y.id==i.id)||{n:"Unavailable item",p:0,k:"#ddd"};t+=p.p*i.q;return `<div class="row">${img(p)}<div><b>${p.n}</b><br>Size ${i.s} · ${money(p.p)}<div class="q" data-i="${x}"><button data-d="-1">−</button> ${i.q} <button data-d="1">+</button></div></div><button class="lnk" data-r="${x}">Remove</button></div>`}).join("")+`<p class="tot">Total ${money(t)}</p><button class="btn" id="co">Checkout</button><p class="mut" id="cm"></p>`;
$("#co").onclick=()=>$("#cm").textContent="Checkout will be connected to Razorpay in a later step."}
$("#ct").onclick=e=>{const b=e.target,c=rd();
if(b.dataset.d){const x=b.parentNode.dataset.i;c[x].q+=+b.dataset.d;if(c[x].q<1)c.splice(x,1)}
else if(b.dataset.r){c.splice(b.dataset.r,1)}else return;
wr(c);head();draw()};
draw();
});</script>
</body></html>
