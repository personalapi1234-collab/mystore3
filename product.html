<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="hd"></div>
<div class="pd" id="pd"></div>
<div id="ft"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="config.js"></script>
<script src="app.js"></script>
<script>ready.then(()=>{
const p=P.find(x=>x.id==new URLSearchParams(location.search).get("id"))||P[0];if(!p){$("#pd").textContent="No products yet.";return}let s="M";
document.title=STORE+" – "+p.n;
$("#pd").innerHTML=`${img(p)}<div><h1>${p.n}</h1><p class="pr">${money(p.p)}</p><p class="mut">Size</p><div class="sz">${["S","M","L","XL"].map(z=>`<button class="${z==s?"on":""}">${z}</button>`).join("")}</div><button class="btn" id="a">Add to bag</button><p class="mut" id="m"></p></div>`;
$(".sz").onclick=e=>{if(e.target.tagName=="BUTTON"){s=e.target.textContent;document.querySelectorAll(".sz button").forEach(b=>b.classList.toggle("on",b==e.target))}};
$("#a").onclick=()=>{add(p.id,s);$("#m").textContent="Added to bag, size "+s}
});</script>
</body></html>
